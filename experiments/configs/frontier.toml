# Harm-vs-interruption frontiers: every parameterized policy across its cost/threshold. SIMULATED.
# Comparing whole frontiers avoids cherry-picking one operating point per policy.
name = "frontier"
description = "Sweeps of interruption cost (adaptive, myopic) and thresholds (fixed, confidence)."
scenarios = ["all"]
episodes = 150
seed = 314159
bootstrap = 0

[[policies]]
name = "full_autonomy"
[[policies]]
name = "always_confirm"
[[policies]]
name = "rule_based"

